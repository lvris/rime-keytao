name: Release Android Package

on:
  push:
    branches:
      - master
    paths:
      - 'rime/**'
      - '.github/workflows/release-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  TAG_PREFIX: dict-
  KEEP_RELEASES: 10

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rime_deployer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librime-bin librime-data

      # Only rime/ is packaged: schema/android/ would overwrite the customized keytao.schema.yaml
      - name: Validate schema and dictionaries
        run: |
          WORK=$(mktemp -d)
          cp -r rime/. "$WORK/"
          rime_deployer --build "$WORK" /usr/share/rime-data "$WORK/build" 2>&1 | tee deploy.log
          if grep -E '^E[0-9]' deploy.log; then
            exit 1
          fi
          test -s "$WORK/build/keytao.extended.table.bin"

      - name: Build package
        run: (cd rime && zip -qr ../keytao-android.zip .)

      # gh publishes the release only after the upload, so the latest URL never returns 404
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${TAG_PREFIX}$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          git log -1 --format=%B > notes.txt
          gh release create "$TAG" keytao-android.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.txt \
            --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Xime reads <base_url>/rimes/index.yaml and offers an update when currentVersion changes
      - name: Publish Xime store index
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          SHA256=$(sha256sum keytao-android.zip | cut -d' ' -f1)
          SIZE_BYTES=$(stat -c %s keytao-android.zip)
          SIZE=$(awk "BEGIN { printf \"%.2f MB\", $SIZE_BYTES / 1048576 }")
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          CHANGELOG=$(git log -1 --format=%s | jq -R .)
          git switch --orphan xime-index
          mkdir rimes
          cat > rimes/index.yaml <<EOF
          index_version: 1
          updated_at: '$DATE'
          schemas:
          - id: keytao
            name: 键道6
            author: lvris
            description: 个人自用方案，修改自星空键道6
            type: remote
            homepage: https://github.com/$GITHUB_REPOSITORY
            appVersion: '>=3.4.2'
            currentVersion: $TAG
            versions:
            - version: $TAG
              date: '$DATE'
              changelog: $CHANGELOG
              downloadUrl:
              - url: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/keytao-android.zip
                sha256: $SHA256
                size: $SIZE
                sizeBytes: $SIZE_BYTES
          EOF
          git add rimes
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Update index: $TAG"
          git push -f origin xime-index

      - name: Remove old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"$TAG_PREFIX\"))] | sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
